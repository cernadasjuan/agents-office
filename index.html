<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; }

    .agent-label {
      background: rgba(20, 20, 40, 0.85);
      color: #e0e0ff;
      padding: 4px 10px;
      border-radius: 8px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      border: 1px solid rgba(120, 120, 255, 0.3);
      backdrop-filter: blur(4px);
    }
    .agent-label .name {
      font-weight: 600;
      font-size: 12px;
      color: #fff;
    }
    .agent-label .activity {
      color: #8888ff;
      font-size: 10px;
      margin-top: 1px;
    }
    /* Compact label (label detail, key V): agent color dot and the name only, capped width. */
    .agent-label.compact {
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(20, 20, 40, 0.6);
      opacity: 0.85;
    }
    .agent-label.compact .name {
      display: inline-block;
      max-width: 9em;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      font-size: 9px;
      font-weight: 500;
    }
    .agent-label.compact::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 4px;
      border-radius: 50%;
      vertical-align: middle;
      background: var(--agent-color, #8888ff);
    }
    .agent-label.compact .activity { display: none; }

    #ui-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(20, 20, 40, 0.9);
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 12px;
      padding: 16px;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      min-width: 220px;
      max-width: 320px;
      max-height: 80vh;
      overflow-y: auto;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(120, 120, 255, 0.2);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    #ui-panel h2 { font-size: 14px; color: #fff; }
    .view-status { font-size: 11px; color: #a8b8ff; margin-top: 2px; }
    .panel-buttons { display: flex; gap: 4px; }
    .panel-button {
      background: none;
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 4px;
      color: #e0e0ff;
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
    #ui-panel.collapsed { min-width: 0; }
    .triage-loading { color: #a8b8ff; font-size: 12px; padding: 4px 0; }
    .triage-loading[hidden] { display: none; }
    #ui-panel.collapsed .triage-loading { display: none; }
    .panel-footer {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(120, 120, 255, 0.2);
      font-size: 10px;
      color: #8888aa;
    }
    .panel-footer[data-level="warn"] { color: #f3dc85; }
    .panel-footer[data-level="down"] { color: #ff8a80; font-weight: 600; }
    #legend {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      background: rgba(20, 20, 40, 0.95);
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 12px;
      padding: 14px 18px;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      backdrop-filter: blur(8px);
      z-index: 300;
    }
    #legend[hidden] { display: none; }
    .legend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .legend-header h3 { font-size: 14px; color: #fff; }
    .legend-close {
      background: none; border: 1px solid rgba(120, 120, 255, 0.3); border-radius: 4px;
      color: #e0e0ff; width: 22px; height: 22px; cursor: pointer;
    }
    #legend h4 { font-size: 11px; color: #a8b8ff; margin: 8px 0 3px; }
    #legend dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; }
    #legend dt { color: #fff; font-weight: 600; }
    #legend dd { color: #c8c8e8; }
    #ui-panel.collapsed .triage-groups { display: none; }
    .triage-filter {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 6px;
      color: #e0e0ff;
      font-size: 12px;
    }
    .triage-filter::placeholder { color: #8888aa; }
    #ui-panel.collapsed .triage-filter { display: none; }
    .triage-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .triage-chip {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 10px;
      color: #e0e0ff;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .triage-chip[data-group="needs-you"] { border-color: #ff7a59; color: #ffb199; }
    .triage-chip[data-group="your-turn"] { border-color: #e8c547; color: #f3dc85; }
    .triage-group { margin-bottom: 8px; }
    .triage-group-header {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 0;
      cursor: pointer;
    }
    .triage-group[data-group="needs-you"] .triage-group-header { color: #ffb199; }
    .triage-group.collapsed .triage-rows { display: none; }
    .agent-card {
      margin-bottom: 4px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
    }
    .agent-card.subagent { margin-left: 16px; font-size: 12px; }
    .agent-card.selectable { cursor: pointer; }
    .agent-card.selectable:hover { background: rgba(255,255,255,0.1); }
    .agent-card.selected {
      background: rgba(120, 120, 255, 0.18);
      box-shadow: inset 0 0 0 1px rgba(160, 160, 255, 0.6);
    }
    #ui-panel h2 .label-mode {
      margin-left: 8px;
      font-size: 10px;
      font-weight: 400;
      color: #8888ff;
    }
    .agent-top { display: flex; justify-content: space-between; gap: 8px; }
    .agent-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .agent-wait { color: #ffb199; font-size: 11px; white-space: nowrap; }
    .agent-activity { color: #8888ff; font-size: 11px; }
    .agent-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
    .agent-provider, .agent-badge {
      font-size: 10px;
      padding: 0 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
    }
    .agent-provider { color: #9fe0c0; }
    .agent-badge { color: #d0c0ff; }
    #agent-inspector {
      position: fixed;
      top: 16px;
      right: 352px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: rgba(20, 20, 40, 0.92);
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    #agent-inspector[hidden] { display: none; }
    .inspector-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .inspector-name { font-size: 15px; color: #fff; overflow-wrap: anywhere; }
    .inspector-close {
      background: none; border: 1px solid rgba(120, 120, 255, 0.3); border-radius: 4px;
      color: #e0e0ff; width: 22px; height: 22px; cursor: pointer; flex: none;
    }
    .inspector-state { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: #8888ff; }
    .inspector-band { font-size: 10px; padding: 0 6px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); }
    .inspector-band[data-band="fresh"] { color: #ffb199; border: 1px solid #ff7a59; }
    .inspector-band[data-band="aging"] { color: #f3dc85; border: 1px solid #e8c547; }
    .inspector-band[data-band="cold"] { color: #a0a8c0; border: 1px solid #6a7090; }
    .inspector-wait { color: #ffb199; margin-top: 2px; }
    .inspector-facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; }
    .inspector-facts dt { color: #8888ff; }
    .inspector-facts dd { overflow-wrap: anywhere; }
    .inspector-parent { margin-bottom: 6px; }
    .inspector-actions { display: flex; gap: 6px; margin: 6px 0; }
    .inspector-actions button {
      background: #4a5bd9; border: none; border-radius: 6px; color: #fff;
      padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .inspector-actions button:disabled { opacity: 0.6; cursor: wait; }
    /* Key F (issue #85 fix): a 1.5 s highlight, never a focus ring (DOM focus never moves here). */
    .inspector-actions button.pulse { box-shadow: 0 0 0 3px #ffb199; background: #ff7a59; }
    .inspector-status { color: #9fe0c0; margin-bottom: 6px; }
    .inspector-section { border-top: 1px solid rgba(120, 120, 255, 0.2); padding-top: 6px; margin-top: 6px; }
    .inspector-section h4 { font-size: 11px; color: #fff; margin-bottom: 3px; }
    .inspector-section ul { list-style: none; }
    .inspector-section li { padding: 1px 0; overflow-wrap: anywhere; }
    .inspector-section p { color: #8888aa; }
    .inspector-section a { color: #a8b8ff; }
    .peek-question {
      margin-top: 6px; padding: 4px 6px; border-radius: 4px; overflow-wrap: anywhere;
      color: #ffe2a8; background: rgba(232, 197, 71, 0.12); border: 1px solid #e8c547;
    }
    .peek-question[hidden], .peek-recent[hidden], .peek-assets[hidden], .peek-equipment[hidden] { display: none; }
    .peek-recent li.peek-tool { color: #8888ff; font-size: 11px; }
    .inspector-link {
      background: none; border: none; padding: 0; color: #a8b8ff; font: inherit;
      cursor: pointer; text-align: left; text-decoration: underline;
    }
    #pointer-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 40, 0.85);
      color: #e0e0ff;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      border: 1px solid rgba(120, 120, 255, 0.3);
      backdrop-filter: blur(4px);
      z-index: 200;
      pointer-events: none;
    }
    /* Off-screen marker: an arrow at the screen edge pointing at a fresh wait outside the frame (#86). */
    #offscreen-markers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
    .offscreen-marker {
      position: absolute;
      top: 0;
      left: 0;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      pointer-events: auto;
    }
    .offscreen-marker::before {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 14px solid var(--agent-color, #ff7a59);
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.6));
    }
    /* Markers that would collide merge into one, with a count, instead of stacking unclickable arrows. */
    .offscreen-marker-cluster::before { display: none; }
    .offscreen-marker-cluster {
      border-radius: 50%;
      background: var(--agent-color, #ff7a59);
      color: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 28px;
      text-align: center;
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.6));
    }

    .agent-card select {
      width: 100%;
      margin-top: 4px;
      background: rgba(40, 40, 80, 0.8);
      color: #e0e0ff;
      border: 1px solid rgba(120, 120, 255, 0.3);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="pointer-hint">Click to look around &mdash; WASD to move &mdash; Space/Q up/down &mdash; Shift = fast &mdash; ESC to release &mdash; Click a figure to select &mdash; O = overview &mdash; Shift+L = layout</div>
  <div id="offscreen-markers"></div>
  <div id="ui-panel">
    <div class="panel-header">
      <div class="panel-title">
        <h2>Agents Office <span id="label-mode" class="label-mode"></span></h2>
        <div id="view-status" class="view-status"></div>
      </div>
      <div class="panel-buttons">
        <button type="button" id="legend-button" class="panel-button">?</button>
        <button type="button" id="ui-panel-toggle" class="panel-button" aria-controls="agent-list"></button>
      </div>
    </div>
    <div id="agent-list"></div>
    <div id="panel-footer" class="panel-footer"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
